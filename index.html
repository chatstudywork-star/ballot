<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanrio Sprint Spiral Lucky Draw</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink: #ffe6f2;
      --panel-bg: #fff0f6;
      --card-white: #ffffff;
      --accent-pink: #ff66a3;
      --accent-purple: #b366ff;
      --accent-yellow: #ffeb3b;
      --text-dark: #5c3d46;
      --border-color: #ffb3d9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
    }

    body {
      background-color: var(--bg-pink);
      background-image: 
        radial-gradient(#ffb3d9 15%, transparent 16%),
        radial-gradient(#ffb3d9 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.8rem;
      color: var(--accent-pink);
      text-shadow: 3px 3px 0px #fff, 6px 6px 0px var(--border-color);
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #885062;
      font-weight: 700;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    .stage-card {
      background: var(--card-white);
      border: 6px solid var(--border-color);
      border-radius: 30px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(255, 102, 163, 0.2);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* SVG Spiral Canvas */
    #spiral-svg {
      width: 100%;
      max-width: 480px;
      height: auto;
      overflow: visible;
    }

    .spiral-track {
      fill: none;
      stroke: #ffe6f0;
      stroke-width: 32;
      stroke-linecap: round;
    }

    .spiral-track-border {
      fill: none;
      stroke: var(--border-color);
      stroke-width: 36;
      stroke-linecap: round;
    }

    .runner-node {
      transition: transform 0.05s linear;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      padding: 12px 32px;
      border: 4px solid #fff;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 0px rgba(0, 0, 0, 0.1);
      outline: none;
    }

    .btn-spin {
      background-color: var(--accent-pink);
      color: white;
      box-shadow: 0 6px 0px #cc0052;
    }

    .btn-spin:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 0px #cc0052;
      background-color: #ff4d94;
    }

    .btn-spin:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0px #cc0052;
    }

    .btn-spin:disabled {
      background-color: #cccccc;
      box-shadow: 0 6px 0px #999999;
      cursor: not-allowed;
    }

    /* Roster Cards */
    .roster {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      width: 100%;
      margin-top: 10px;
    }

    .roster-item {
      background: var(--panel-bg);
      border: 3px solid var(--border-color);
      border-radius: 15px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .roster-item .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    /* Prize Showcase Section */
    .prizes-section {
      background: var(--card-white);
      border: 6px solid var(--border-color);
      border-radius: 30px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 10px 20px rgba(255, 102, 163, 0.2);
    }

    .prizes-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      color: var(--accent-pink);
      text-align: center;
      margin-bottom: 15px;
    }

    .prizes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .prize-card {
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 18px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .prize-badge {
      background: var(--accent-pink);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .prize-toy {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .prize-code {
      font-size: 0.75rem;
      color: #888;
      font-family: monospace;
    }

    /* Winner Modal overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(92, 61, 70, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: white;
      border: 6px solid var(--accent-pink);
      border-radius: 35px;
      padding: 25px 30px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .winner-avatar {
      width: 110px;
      height: 110px;
      margin: 15px auto;
      border-radius: 50%;
      border: 4px solid var(--accent-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-pink);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .winner-avatar svg {
      width: 80px;
      height: 80px;
    }

    .winner-title {
      font-family: 'Fredoka One', cursive;
      color: var(--accent-pink);
      font-size: 2rem;
    }

    .winner-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 5px;
    }

    .winner-sanrio {
      font-size: 1.1rem;
      color: var(--accent-purple);
      font-weight: 700;
      margin-bottom: 15px;
    }

    .winner-prize-info {
      background: var(--panel-bg);
      border: 2px dashed var(--accent-pink);
      border-radius: 15px;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sanrio Lucky Sprint</h1>
    <p class="subtitle">Spiral Staff Draw Arena</p>
  </header>

  <div class="container">
    <div class="stage-card">
      <svg id="spiral-svg" viewBox="0 0 500 500">
        <!-- Spiral tracks rendered dynamically -->
        <g id="track-group"></g>
        <!-- Nodes/Players on Spiral -->
        <g id="runners-group"></g>
        <!-- Finish Line Center Indicator -->
        <circle cx="250" cy="250" r="22" fill="#ffeb3b" stroke="#ffb3d9" stroke-width="4"/>
        <text x="250" y="256" text-anchor="middle" font-family="Fredoka One" font-size="16" fill="#ff66a3">WIN</text>
      </svg>

      <div class="controls">
        <button class="btn btn-spin" id="spin-btn">SPIN SPIRAL!</button>
      </div>
    </div>

    <!-- Roster displaying Sanrio Associations with Staff Numbers -->
    <div class="roster" id="roster-container"></div>

    <!-- Prize Showcase Section -->
    <div class="prizes-section">
      <div class="prizes-title">🎁 Giant Sanrio Puff Plush Prizes 🎁</div>
      <div class="prizes-grid" id="prizes-grid"></div>
    </div>
  </div>

  <!-- Winner Dialog -->
  <div class="modal-overlay" id="winner-modal">
    <div class="modal-card">
      <div class="winner-title">🎉 WINNER! 🎉</div>
      <div class="winner-avatar" id="modal-avatar"></div>
      <div class="winner-name" id="modal-name">Staff #1004</div>
      <div class="winner-sanrio" id="modal-sanrio">Hello Kitty Buddy</div>
      <div class="winner-prize-info" id="modal-prize-info">
        <strong>Prize Unlocked:</strong> Giant Sanrio Puff Plush Toy<br>
        <span style="font-size: 0.8rem; color: #777;" id="modal-claim-code">Claim Code: SANRIO-1004</span>
      </div>
      <button class="btn btn-spin" id="close-modal-btn">CLAIM PRIZE</button>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    // --- SANRIO CHARACTERS & PARTICIPANTS DATA (STAFF NUMBERS) ---
    const PLAYERS = [
      { id: '1004', name: 'Staff #1004', staffId: '1004', sanrio: 'Hello Kitty', color: '#ff4d6d', bg: '#ffe6ea', toy: 'Giant Hello Kitty Puff Plush' },
      { id: '1005', name: 'Staff #1005', staffId: '1005', sanrio: 'Pompompurin', color: '#ffb703', bg: '#fff8e7', toy: 'Giant Pompompurin Cushion Plush' },
      { id: '1006', name: 'Staff #1006', staffId: '1006', sanrio: 'Cinnamoroll', color: '#3a86ff', bg: '#eef5ff', toy: 'Giant Fluffy Cinnamoroll Plush' },
      { id: '1007', name: 'Staff #1007', staffId: '1007', sanrio: 'Kuromi', color: '#8338ec', bg: '#f3e8ff', toy: 'Giant Gothic Kuromi Puff Plush' },
      { id: '1046', name: 'Staff #1046', staffId: '1046', sanrio: 'Keroppi', color: '#38b000', bg: '#eafaf1', toy: 'Giant Keroppi Meadow Plush' },
      { id: '1103', name: 'Staff #1103', staffId: '1103', sanrio: 'My Melody', color: '#ff66b2', bg: '#ffeaf4', toy: 'Giant Sweet My Melody Puff Plush' },
      { id: '1113', name: 'Staff #1113', staffId: '1113', sanrio: 'Badtz-Maru', color: '#4a4e69', bg: '#f0f0f5', toy: 'Giant Cool Badtz-Maru Puff Plush' },
      { id: '1131', name: 'Staff #1131', staffId: '1131', sanrio: 'Tuxedosam', color: '#00b4d8', bg: '#e0f7fa', toy: 'Giant Tuxedosam Sailor Plush' },
      { id: '1132', name: 'Staff #1132', staffId: '1132', sanrio: 'Little Twin Stars', color: '#ff99c8', bg: '#fff0f5', toy: 'Giant Pastel Twin Stars Cushion' }
    ];

    // --- SVG AVATAR SVGs GENERATOR ---
    function getSanrioSVG(sanrioId) {
      switch(sanrioId) {
        case 'Hello Kitty':
          return `<svg viewBox="0 0 100 100">
            <ellipse cx="50" cy="55" rx="35" ry="25" fill="#fff" stroke="#333" stroke-width="3"/>
            <ellipse cx="38" cy="55" rx="3.5" ry="5" fill="#333"/>
            <ellipse cx="62" cy="55" rx="3.5" ry="5" fill="#333"/>
            <ellipse cx="50" cy="62" rx="4" ry="3" fill="#ffb703"/>
            <circle cx="70" cy="38" r="6" fill="#ff4d6d" stroke="#333" stroke-width="2"/>
            <path d="M 66 32 C 55 25, 55 45, 66 42 Z" fill="#ff4d6d" stroke="#333" stroke-width="2"/>
            <path d="M 74 32 C 85 25, 85 45, 74 42 Z" fill="#ff4d6d" stroke="#333" stroke-width="2"/>
          </svg>`;
        case 'Pompompurin':
          return `<svg viewBox="0 0 100 100">
            <ellipse cx="50" cy="55" rx="34" ry="28" fill="#ffeb3b" stroke="#333" stroke-width="3"/>
            <path d="M 38 32 C 38 22, 62 22, 62 32 Z" fill="#6f4e37" stroke="#333" stroke-width="2"/>
            <circle cx="50" cy="22" r="3" fill="#6f4e37"/>
            <ellipse cx="20" cy="50" rx="6" ry="14" fill="#ffeb3b" stroke="#333" stroke-width="3" transform="rotate(20 20 50)"/>
            <ellipse cx="80" cy="50" rx="6" ry="14" fill="#ffeb3b" stroke="#333" stroke-width="3" transform="rotate(-20 80 50)"/>
            <circle cx="40" cy="54" r="3" fill="#333"/>
            <circle cx="60" cy="54" r="3" fill="#333"/>
            <path d="M 47 60 Q 50 58 53 60 Q 50 64 47 60" fill="#333"/>
          </svg>`;
        case 'Cinnamoroll':
          return `<svg viewBox="0 0 100 100">
            <ellipse cx="50" cy="58" rx="32" ry="22" fill="#fff" stroke="#333" stroke-width="3"/>
            <path d="M 22 55 C 0 50, 0 70, 20 65" fill="#fff" stroke="#333" stroke-width="3"/>
            <path d="M 78 55 C 100 50, 100 70, 80 65" fill="#fff" stroke="#333" stroke-width="3"/>
            <circle cx="38" cy="58" r="3.5" fill="#3a86ff"/>
            <circle cx="62" cy="58" r="3.5" fill="#3a86ff"/>
            <ellipse cx="30" cy="63" rx="4" ry="2.5" fill="#ffb3d9"/>
            <ellipse cx="70" cy="63" rx="4" ry="2.5" fill="#ffb3d9"/>
            <path d="M 47 63 Q 50 66 53 63" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
          </svg>`;
        case 'Kuromi':
          return `<svg viewBox="0 0 100 100">
            <path d="M 25 50 L 15 20 L 38 38 Z" fill="#333" stroke="#333" stroke-width="2"/>
            <path d="M 75 50 L 85 20 L 62 38 Z" fill="#333" stroke="#333" stroke-width="2"/>
            <circle cx="15" cy="20" r="4" fill="#ff66a3"/>
            <circle cx="85" cy="20" r="4" fill="#ff66a3"/>
            <ellipse cx="50" cy="58" rx="32" ry="24" fill="#fff" stroke="#333" stroke-width="3"/>
            <path d="M 50 30 Q 44 22 50 18 Q 56 22 50 30 Z" fill="#ff66a3"/>
            <path d="M 34 54 Q 40 50 42 58" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
            <path d="M 66 54 Q 60 50 58 58" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
          </svg>`;
        case 'Keroppi':
          return `<svg viewBox="0 0 100 100">
            <ellipse cx="50" cy="60" rx="34" ry="24" fill="#70e000" stroke="#333" stroke-width="3"/>
            <circle cx="35" cy="36" r="16" fill="#fff" stroke="#333" stroke-width="3"/>
            <circle cx="65" cy="36" r="16" fill="#fff" stroke="#333" stroke-width="3"/>
            <circle cx="38" cy="36" r="4" fill="#333"/>
            <circle cx="62" cy="36" r="4" fill="#333"/>
            <path d="M 45 62 L 50 67 L 55 62" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="26" cy="60" r="4" fill="#ff4d6d" opacity="0.6"/>
            <circle cx="74" cy="60" r="4" fill="#ff4d6d" opacity="0.6"/>
          </svg>`;
        case 'My Melody':
          return `<svg viewBox="0 0 100 100">
            <path d="M 28 50 C 15 20, 35 10, 42 35 Z" fill="#ff66b2" stroke="#333" stroke-width="2"/>
            <path d="M 72 50 C 85 20, 65 10, 58 35 Z" fill="#ff66b2" stroke="#333" stroke-width="2"/>
            <ellipse cx="50" cy="58" rx="30" ry="22" fill="#fff" stroke="#333" stroke-width="3"/>
            <circle cx="38" cy="56" r="3" fill="#333"/>
            <circle cx="62" cy="56" r="3" fill="#333"/>
            <ellipse cx="50" cy="61" rx="3.5" ry="2.5" fill="#ffb703"/>
            <circle cx="36" cy="40" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
          </svg>`;
        case 'Badtz-Maru':
          return `<svg viewBox="0 0 100 100">
            <path d="M 30 40 L 20 15 L 40 28 L 50 10 L 60 28 L 80 15 L 70 40 Z" fill="#333" stroke="#333" stroke-width="2"/>
            <ellipse cx="50" cy="58" rx="30" ry="24" fill="#333" stroke="#333" stroke-width="3"/>
            <ellipse cx="40" cy="54" rx="7" ry="9" fill="#fff"/>
            <ellipse cx="60" cy="54" rx="7" ry="9" fill="#fff"/>
            <circle cx="40" cy="54" r="3" fill="#333"/>
            <circle cx="60" cy="54" r="3" fill="#333"/>
            <polygon points="45,62 55,62 50,70" fill="#ffb703" stroke="#333" stroke-width="1.5"/>
          </svg>`;
        case 'Tuxedosam':
          return `<svg viewBox="0 0 100 100">
            <ellipse cx="50" cy="58" rx="32" ry="26" fill="#00b4d8" stroke="#333" stroke-width="3"/>
            <ellipse cx="50" cy="62" rx="20" ry="18" fill="#fff"/>
            <ellipse cx="50" cy="32" rx="14" ry="6" fill="#fff" stroke="#333" stroke-width="2"/>
            <path d="M 40 32 L 60 32 L 50 22 Z" fill="#ff4d6d"/>
            <circle cx="40" cy="54" r="3" fill="#333"/>
            <circle cx="60" cy="54" r="3" fill="#333"/>
            <polygon points="47,58 53,58 50,63" fill="#ffb703"/>
            <rect x="44" y="70" width="12" height="6" rx="3" fill="#ff4d6d"/>
          </svg>`;
        case 'Little Twin Stars':
          return `<svg viewBox="0 0 100 100">
            <ellipse cx="38" cy="56" rx="18" ry="20" fill="#ff99c8" stroke="#333" stroke-width="2"/>
            <ellipse cx="62" cy="56" rx="18" ry="20" fill="#90e0ef" stroke="#333" stroke-width="2"/>
            <ellipse cx="38" cy="60" rx="12" ry="14" fill="#fff"/>
            <ellipse cx="62" cy="60" rx="12" ry="14" fill="#fff"/>
            <circle cx="35" cy="58" r="2" fill="#333"/>
            <circle cx="65" cy="58" r="2" fill="#333"/>
            <polygon points="50,25 53,32 60,32 54,36 56,43 50,38 44,43 46,36 40,32 47,32" fill="#ffeb3b" stroke="#333" stroke-width="1.5"/>
          </svg>`;
        default:
          return `<circle cx="50" cy="50" r="30" fill="#ffb3d9"/>`;
      }
    }

    // --- SPIRAL MATHEMATICS ---
    const CENTER_X = 250;
    const CENTER_Y = 250;
    const SPIRAL_TURNS = 3.5;
    const MAX_THETA = SPIRAL_TURNS * 2 * Math.PI;

    function getSpiralPoint(t) {
      const theta = (1 - t) * MAX_THETA;
      const r = 30 + (t * 190);
      const x = CENTER_X + r * Math.cos(theta);
      const y = CENTER_Y + r * Math.sin(theta);
      return { x, y, angle: theta };
    }

    function generateSpiralPath() {
      let path = '';
      const steps = 200;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const pt = getSpiralPoint(t);
        path += (i === 0 ? `M ${pt.x} ${pt.y}` : ` L ${pt.x} ${pt.y}`);
      }
      return path;
    }

    // --- RENDER INITIAL UI ---
    const trackGroup = document.getElementById('track-group');
    const runnersGroup = document.getElementById('runners-group');
    const rosterContainer = document.getElementById('roster-container');
    const prizesGrid = document.getElementById('prizes-grid');

    const dPath = generateSpiralPath();

    const borderPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    borderPath.setAttribute("d", dPath);
    borderPath.setAttribute("class", "spiral-track-border");
    trackGroup.appendChild(borderPath);

    const fillPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    fillPath.setAttribute("d", dPath);
    fillPath.setAttribute("class", "spiral-track");
    trackGroup.appendChild(fillPath);

    const playerElements = [];

    PLAYERS.forEach((player, index) => {
      // Create SVG Runner node with Staff ID label
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "runner-node");
      
      g.innerHTML = `
        <circle r="20" fill="${player.bg}" stroke="${player.color}" stroke-width="3" />
        <g transform="translate(-14, -14) scale(0.28)">
          ${getSanrioSVG(player.sanrio)}
        </g>
        <rect x="-28" y="20" width="56" height="16" rx="8" fill="${player.color}" />
        <text x="0" y="31" text-anchor="middle" font-family="Quicksand" font-weight="700" font-size="9" fill="#fff">#${player.staffId}</text>
      `;

      runnersGroup.appendChild(g);

      playerElements.push({
        ...player,
        element: g,
        progress: index * (1 / PLAYERS.length)
      });

      // Render Roster item with Staff #
      const item = document.createElement("div");
      item.className = "roster-item";
      item.innerHTML = `
        <div class="dot" style="background: ${player.color}"></div>
        <span>Staff #${player.staffId}</span>
        <span style="color: #888; font-size:0.8rem">(${player.sanrio})</span>
      `;
      rosterContainer.appendChild(item);

      // Render Prize Showcase Cards
      const prizeCard = document.createElement("div");
      prizeCard.className = "prize-card";
      prizeCard.innerHTML = `
        <span class="prize-badge">Staff #${player.staffId}</span>
        <div class="prize-toy">${player.toy}</div>
        <div class="prize-code">SANRIO-${player.staffId}</div>
      `;
      prizesGrid.appendChild(prizeCard);
    });

    function updatePositions() {
      playerElements.forEach(p => {
        const normProgress = Math.max(0, Math.min(1, p.progress));
        const pt = getSpiralPoint(normProgress);
        p.element.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);
      });
    }

    updatePositions();

    // --- SPRINT ANIMATION & LUCKY DRAW LOGIC ---
    let isSpinning = false;
    const spinBtn = document.getElementById('spin-btn');

    spinBtn.addEventListener('click', startSprint);

    function startSprint() {
      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;

      const winnerIndex = Math.floor(Math.random() * PLAYERS.length);
      
      const duration = 7000;
      const startTime = performance.now();
      const extraLaps = 5 + Math.random() * 2;

      playerElements.forEach((p, idx) => {
        const offsetFromWinner = (idx - winnerIndex + PLAYERS.length) % PLAYERS.length;
        p.targetEnd = 0 - (offsetFromWinner * 0.05); 
        p.startPos = 1 - (idx * (1 / PLAYERS.length));
        p.totalDistance = (p.startPos - p.targetEnd) + extraLaps;
      });

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const p = Math.min(elapsed / duration, 1);

        const ease = 1 - Math.pow(1 - p, 3);

        playerElements.forEach(player => {
          const currentDist = player.startPos - (player.totalDistance * ease);
          let spiralPos = currentDist % 1;
          if (spiralPos < 0) spiralPos += 1;

          if (p > 0.93) {
            spiralPos = player.targetEnd < 0 ? Math.abs(player.targetEnd) : player.targetEnd;
          }

          player.progress = spiralPos;
        });

        updatePositions();

        if (p < 1) {
          requestAnimationFrame(animate);
        } else {
          setTimeout(() => {
            showWinner(PLAYERS[winnerIndex]);
            isSpinning = false;
            spinBtn.disabled = false;
          }, 300);
        }
      }

      requestAnimationFrame(animate);
    }

    // --- WINNER MODAL & CONFETTI ---
    const modal = document.getElementById('winner-modal');
    const modalName = document.getElementById('modal-name');
    const modalSanrio = document.getElementById('modal-sanrio');
    const modalAvatar = document.getElementById('modal-avatar');
    const modalPrizeInfo = document.getElementById('modal-prize-info');
    const modalClaimCode = document.getElementById('modal-claim-code');
    const closeModalBtn = document.getElementById('close-modal-btn');

    function showWinner(winner) {
      modalName.textContent = `Staff ID: #${winner.staffId}`;
      modalSanrio.textContent = `partnered with ${winner.sanrio}!`;
      modalAvatar.innerHTML = getSanrioSVG(winner.sanrio);
      modalAvatar.style.background = winner.bg;
      modalAvatar.style.borderColor = winner.color;

      modalPrizeInfo.querySelector('strong').nextSibling.nodeValue = ` ${winner.toy}`;
      modalClaimCode.textContent = `Claim Code: SANRIO-${winner.staffId}`;

      modal.classList.add('active');
      triggerConfetti();
    }

    closeModalBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    // --- CANVAS CONFETTI EFFECT ---
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti() {
      particles = [];
      const colors = ['#ff4d6d', '#ffb703', '#3a86ff', '#8338ec', '#38b000', '#ff66b2', '#00b4d8'];
      for (let i = 0; i < 140; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2 - 50,
          vx: (Math.random() - 0.5) * 20,
          vy: (Math.random() - 0.7) * 20,
          size: Math.random() * 10 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rSpeed: (Math.random() - 0.5) * 10
        });
      }
      renderConfetti();
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let active = false;

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.4;
        p.rotation += p.rSpeed;

        if (p.y < canvas.height) active = true;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });

      if (active && modal.classList.contains('active')) {
        requestAnimationFrame(renderConfetti);
      }
    }
  </script>
</body>
</html>
